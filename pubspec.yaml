name: tumaaneena
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management ───────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1

  # ── DI ────────────────────────────────────────────────────────────────────
  get_it: ^8.0.3

  # ── Navigation ────────────────────────────────────────────────────────────
  get: ^4.7.2

  # ── HTTP ──────────────────────────────────────────────────────────────────
  dio: ^5.8.0+1

  # ── Secure Storage ────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── Error Handling ────────────────────────────────────────────────────────
  dartz: ^0.10.1

  # ── Localization ──────────────────────────────────────────────────────────
  easy_localization: ^3.0.7

  # ── Fonts ─────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Animations ────────────────────────────────────────────────────────────
  lottie: ^3.3.1

  # ── Images ────────────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1

  # ── Icons ─────────────────────────────────────────────────────────────────
  font_awesome_flutter: ^10.8.0

  # ── Spacing ───────────────────────────────────────────────────────────────
  gap: ^3.0.1

  # ── Snackbar ──────────────────────────────────────────────────────────────
  animated_snack_bar: ^0.4.0

  # ── Local Preferences ─────────────────────────────────────────────────────
  shared_preferences: ^2.5.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/animations/
    - assets/icons/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
